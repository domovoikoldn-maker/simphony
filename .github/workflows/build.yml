# «Симфония» — сборка APK с НАСТОЯЩЕЙ рекламой Яндекса на серверах GitHub (бесплатно для публичных и приватных репозиториев в пределах лимита).
# Запуск: вкладка Actions → «Сборка APK с рекламой» → Run workflow (или любой push в main).
# Результат: Actions → последний запуск → Artifacts → simfoniya-apk (zip с APK).
#
# Секреты (Settings → Secrets and variables → Actions), необязательно:
#   SIGNING_KEY_BASE64 — файл signing/symphony-release.jks в base64 (команда: base64 -w0 symphony-release.jks)
#   KS_PASS            — пароль из signing/README.txt
# Без секретов release-APK подписывается отладочным ключом: на телефон ставится, в магазин — нет.
name: Сборка APK с рекламой

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Ключ подписи (если задан в секретах)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            mkdir -p signing
            echo "$SIGNING_KEY_BASE64" | base64 -d > signing/symphony-release.jks
            echo "Ключ подписи найден"
          else
            echo "Секрета нет — release будет подписан отладочным ключом"
          fi

      - name: Сборка (debug — тестовые блоки, release — R-M-20314265-2/-3)
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Сложить файлы
        run: |
          mkdir -p out
          cp gradle-app/build/outputs/apk/debug/*.apk out/Simfoniya-TEST-ads-debug.apk
          cp gradle-app/build/outputs/apk/release/*.apk out/Simfoniya-REAL-ads-release.apk
          cp gradle-app/build/outputs/bundle/release/*.aab out/Simfoniya-release.aab || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: simfoniya-apk
          path: out/
          retention-days: 30
